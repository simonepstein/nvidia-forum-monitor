[project]
name = "sparkwatch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp<2",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "rich>=15.0.0",
    "selectolax>=1.0.2",
    "tenacity>=9.2.1",
    "typer>=0.28.0",
]

[project.scripts]
sparkwatch = "sparkwatch:main"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "respx>=0.23.1",
    "ruff>=0.17.4",
]
