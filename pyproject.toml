[project]
name = "sparkwatch"
version = "0.1.0"
description = "DGX Spark / GB10 forum monitor with an MCP interface"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp<2",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "selectolax>=1.0.2",
    "tenacity>=9.2.1",
    "typer>=0.28.0",
]

[project.scripts]
sparkwatch = "sparkwatch.cli:app"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "respx>=0.23.1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: opt-in live tests that hit the forum and GitHub (set SPARKWATCH_LIVE=1)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/sparkwatch/cli.py" = ["B008"]
