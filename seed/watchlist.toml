[[watch]]
label = "GLM 5.3 Flash"
kind = "tracking"
match_regex = 'glm[\s._-]*5\.3[\s._-]*flash'

[[watch]]
label = "DeepSeek V4.1 Flash"
kind = "tracking"
match_regex = 'deepseek[\s._-]*v?4\.1[\s._-]*flash'

[[watch]]
label = "Qwen3.8 Flash Next"
kind = "tracking"
match_regex = 'qwen[\s._-]*3\.8[\s._-]*(flash|next)'

[[watch]]
label = "Qwen4"
kind = "anticipated"
# Excludes vLLM's Qwen4Exp / qwen4_exp (Qwen3.8 Flash Next's architecture) and "Qwen 4B".
match_regex = 'qwen[\s._-]*4(?![\d.])(?![\s_-]*exp)(?!\s*b\b)'
# Only a real release raises the sighting; hopeful phrasing still matches the agent's judgement.
release_regex = 'huggingface\.co/qwen/qwen[\s._-]*4(?![\d.])|qwen[\s._-]*4\b[^\n]{0,40}\b(released|weights (are )?(out|available)|now available|is out)'
